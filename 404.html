<script>
/* GitHub Pages SPA fallback for the application under /app/.
   Deep links such as /app/scenario/123 are rewritten to /app/?/scenario/123
   so the app router can restore them. Everything else renders the branded
   404 below (previously this script tried to write document.body before
   <body> existed and threw). */
(function(){
  var pathSegmentsToKeep = 1;
  var l = window.location;
  if (l.pathname.indexOf('/app/') === 0 || l.pathname === '/app') {
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  }
})();
</script>
<script>
(function(){try{var s=localStorage.getItem('tr-theme')||localStorage.getItem('theme');var t=(s==='light'||s==='dark')?s:'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
